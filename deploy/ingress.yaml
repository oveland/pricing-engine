apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pricing-ingress
  namespace: pricing
  labels:
    app.kubernetes.io/name: pricing-ingress
    app.kubernetes.io/part-of: pricing
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
