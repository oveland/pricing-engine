# =============================================================================
# SonarCloud Configuration — Frontend
# =============================================================================

sonar.projectKey=pricing-engine-frontend
sonar.projectName=pricing-engine-frontend
sonar.organization=oveland

# Source configuration
sonar.sources=src
sonar.exclusions=src/**/*.test.tsx,src/**/*.test.ts,src/test/**,src/vite-env.d.ts,src/main.tsx,src/App.tsx
sonar.test.inclusions=src/**/*.test.tsx,src/**/*.test.ts,src/test/**

# Coverage
sonar.javascript.lcov.reportPaths=coverage/lcov.info
