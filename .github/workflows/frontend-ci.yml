# =============================================================================
# Frontend CI Pipeline — Format, Lint, Test, Build & SonarCloud
# =============================================================================
# Triggers on pushes and PRs that touch frontend code.
# Each quality gate runs as a separate job for clear pipeline visibility.
# npm cache + node_modules artifact shared across jobs to avoid reinstalling.
# =============================================================================

name: Frontend CI

on:
  push:
    branches: [master, develop]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [master, develop]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

env:
  NODE_VERSION: '20'

jobs:
  # ---------------------------------------------------------------------------
  # Gate 0: Install dependencies (shared by all jobs)
  # ---------------------------------------------------------------------------
  install:
    name: "\U0001F4E6 Install"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Upload node_modules
        uses: actions/upload-artifact@v4
        with:
          name: frontend-node-modules
          path: frontend/node_modules/
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Gate 1: Prettier — Code Formatting
  # ---------------------------------------------------------------------------
  format:
    name: "\U0001F3A8 Prettier"
    runs-on: ubuntu-latest
    needs: install
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download node_modules
        uses: actions/download-artifact@v4
        with:
          name: frontend-node-modules
          path: frontend/node_modules/

      - name: Check code formatting
        run: npm run format:check

  # ---------------------------------------------------------------------------
  # Gate 2: ESLint — Linting
  # ---------------------------------------------------------------------------
  lint:
    name: "\U0001F9F9 ESLint"
    runs-on: ubuntu-latest
    needs: install
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download node_modules
        uses: actions/download-artifact@v4
        with:
          name: frontend-node-modules
          path: frontend/node_modules/

      - name: Run ESLint
        run: npm run lint

  # ---------------------------------------------------------------------------
  # Gate 3: Tests + Coverage
  # ---------------------------------------------------------------------------
  test:
    name: "\U0001F9EA Tests"
    runs-on: ubuntu-latest
    needs: [format, lint]
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download node_modules
        uses: actions/download-artifact@v4
        with:
          name: frontend-node-modules
          path: frontend/node_modules/

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: frontend/coverage/
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Gate 4: Production Build
  # ---------------------------------------------------------------------------
  build:
    name: "\U0001F3D7 Build"
    runs-on: ubuntu-latest
    needs: [format, lint]
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download node_modules
        uses: actions/download-artifact@v4
        with:
          name: frontend-node-modules
          path: frontend/node_modules/

      - name: Build production bundle
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Gate 5: SonarCloud — Centralized Quality Dashboard
  # ---------------------------------------------------------------------------
  sonar:
    name: "☁\uFE0F SonarCloud"
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage-report
          path: frontend/coverage/

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v8
        if: env.SONAR_TOKEN != ''
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: frontend
