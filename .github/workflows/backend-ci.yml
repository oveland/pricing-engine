name: Backend CI

on:
  push:
    branches: [master, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [master, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  format:
    name: "\U0001F3A8 Format"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven
      - run: mvn spotless:check -B

  pmd:
    name: "\U0001F50D PMD"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven
      - run: mvn pmd:pmd pmd:cpd -B
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-pmd-report
          path: |
            backend/target/pmd.xml
            backend/target/cpd.xml
          retention-days: 30

  compile:
    name: "\U00002699 Compile"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven
      - run: mvn compile -B
      - uses: actions/upload-artifact@v4
        with:
          name: backend-compiled
          path: backend/target/
          retention-days: 1

  spotbugs:
    name: "\U0001F41B SpotBugs"
    runs-on: ubuntu-latest
    needs: compile
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven
      - uses: actions/download-artifact@v4
        with:
          name: backend-compiled
          path: backend/target/
      - run: mvn spotbugs:spotbugs -B
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-spotbugs-report
          path: backend/target/spotbugs/
          retention-days: 30

  test:
    name: "\U0001F9EA Tests"
    runs-on: ubuntu-latest
    needs: [format, pmd, spotbugs]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven
      - uses: actions/download-artifact@v4
        with:
          name: backend-compiled
          path: backend/target/
      - run: mvn verify -B -Dmaven.main.skip=true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: backend/target/surefire-reports/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage-report
          path: backend/target/site/jacoco/
          retention-days: 30
      - uses: dorny/test-reporter@v1
        if: always() && github.event_name == 'pull_request'
        with:
          name: Backend Test Results
          path: backend/target/surefire-reports/*.xml
          reporter: java-junit

  sonar:
    name: "☁\uFE0F SonarCloud"
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven
      - uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - uses: actions/download-artifact@v4
        with:
          name: backend-coverage-report
          path: backend/target/site/jacoco/
      - uses: actions/download-artifact@v4
        with:
          name: backend-spotbugs-report
          path: backend/target/spotbugs/
      - uses: actions/download-artifact@v4
        with:
          name: backend-pmd-report
          path: backend/target/
      - env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        if: env.SONAR_TOKEN != ''
        run: >
          mvn compile sonar:sonar -B -DskipTests
          -Dsonar.projectKey=pricing-engine-backend
          -Dsonar.projectName=pricing-engine-backend
          -Dsonar.organization=oveland
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.java.spotbugs.reportPaths=target/spotbugs/spotbugsXml.xml
          -Dsonar.java.pmd.reportPaths=target/pmd.xml
          -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

  build:
    name: "\U0001F4E6 Build"
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven
      - run: mvn package -B -DskipTests
      - uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar
          retention-days: 7

  deploy:
    name: "\U0001F680 Deploy"
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    env:
      ECR_REGISTRY: 262270939214.dkr.ecr.us-east-1.amazonaws.com
      ECR_REPOSITORY: pricing-engine-backend
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Docker Meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}

      - name: Deploy to EKS
        run: |
          aws eks update-kubeconfig --region us-east-1 --name pricing-cluster
          kubectl apply -f deploy/namespace.yaml
          kubectl apply -f deploy/backend-deployment.yaml
          kubectl apply -f deploy/ingress.yaml
          kubectl set image deployment/backend backend=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.version }} -n pricing
          kubectl rollout status deployment/backend -n pricing --timeout=120s
