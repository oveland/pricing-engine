name: Backend CI

on:
  push:
    branches: [master, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [master, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  format:
    name: "\U0001F3A8 Format"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven
      - run: mvn spotless:check -B

  pmd:
    name: "\U0001F50D PMD"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven
      - run: mvn pmd:pmd pmd:cpd -B
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-pmd-report
          path: |
            backend/target/pmd.xml
            backend/target/cpd.xml
          retention-days: 30

  compile:
    name: "\U00002699 Compile"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven
      - run: mvn compile -B
      - uses: actions/upload-artifact@v4
        with:
          name: backend-compiled
          path: backend/target/
          retention-days: 1

  spotbugs:
    name: "\U0001F41B SpotBugs"
    runs-on: ubuntu-latest
    needs: compile
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven
      - uses: actions/download-artifact@v4
        with:
          name: backend-compiled
          path: backend/target/
      - run: mvn spotbugs:spotbugs -B
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-spotbugs-report
          path: backend/target/spotbugs/
          retention-days: 30

  test:
    name: "\U0001F9EA Tests"
    runs-on: ubuntu-latest
    needs: [format, pmd, spotbugs]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven
      - uses: actions/download-artifact@v4
        with:
          name: backend-compiled
          path: backend/target/
      - run: mvn verify -B -Dmaven.main.skip=true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: backend/target/surefire-reports/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage-report
          path: backend/target/site/jacoco/
          retention-days: 30
      - uses: dorny/test-reporter@v1
        if: always() && github.event_name == 'pull_request'
        with:
          name: Backend Test Results
          path: backend/target/surefire-reports/*.xml
          reporter: java-junit

  sonar:
    name: "☁\uFE0F SonarCloud"
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven
      - uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - uses: actions/download-artifact@v4
        with:
          name: backend-coverage-report
          path: backend/target/site/jacoco/
      - uses: actions/download-artifact@v4
        with:
          name: backend-spotbugs-report
          path: backend/target/spotbugs/
      - uses: actions/download-artifact@v4
        with:
          name: backend-pmd-report
          path: backend/target/
      - env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        if: env.SONAR_TOKEN != ''
        run: >
          mvn compile sonar:sonar -B -DskipTests
          -Dsonar.projectKey=pricing-engine-backend
          -Dsonar.projectName=pricing-engine-backend
          -Dsonar.organization=oveland
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.java.spotbugs.reportPaths=target/spotbugs/spotbugsXml.xml
          -Dsonar.java.pmd.reportPaths=target/pmd.xml
          -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

  build:
    name: "\U0001F4E6 Build"
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven
      - run: mvn package -B -DskipTests
      - uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar
          retention-days: 7
