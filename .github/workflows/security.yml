# =============================================================================
# Security Pipeline — Dependency Scanning & SAST
# =============================================================================
# Runs Trivy for vulnerability scanning on filesystem dependencies
# (pom.xml, package-lock.json) and CodeQL for static security analysis.
# =============================================================================

name: Security Scan

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI
  schedule:
    # Run weekly on Mondays at 06:00 UTC to catch new CVEs
    - cron: '0 6 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Trivy — Dependency & filesystem vulnerability scan
  # ---------------------------------------------------------------------------
  trivy-fs-scan:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner (backend)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: backend
          format: sarif
          output: trivy-backend-results.sarif
          severity: CRITICAL,HIGH

      - name: Run Trivy vulnerability scanner (frontend)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: frontend
          format: sarif
          output: trivy-frontend-results.sarif
          severity: CRITICAL,HIGH

      - name: Upload backend Trivy results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-backend-results.sarif
          category: trivy-backend

      - name: Upload frontend Trivy results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-frontend-results.sarif
          category: trivy-frontend

  # ---------------------------------------------------------------------------
  # Job 2: CodeQL — GitHub native SAST
  # ---------------------------------------------------------------------------
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    strategy:
      matrix:
        language: [java-kotlin, javascript-typescript]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Set up JDK 17
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Build Java for CodeQL
        if: matrix.language == 'java-kotlin'
        run: mvn clean compile -B -DskipTests
        working-directory: backend

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
